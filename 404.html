<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Dra. Camila Sandoval Maioli — Fisioterapia</title>
<meta name="description" content="A página que você procura não foi encontrada. Volte para o site da Dra. Camila Sandoval Maioli, fisioterapeuta em São José do Rio Preto.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.SEUDOMINIO.com.br/404.html">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<style>
  .error-page {
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--sp-lg) var(--container-pad);
    background: linear-gradient(180deg, var(--c-bg-alt) 0%, var(--c-bg) 100%);
  }
  .error-code {
    font-size: clamp(3.5rem, 6vw + 1rem, 6rem);
    font-weight: 800;
    color: var(--c-primary);
    line-height: 1;
    margin-bottom: var(--sp-sm);
  }
  .error-page p { max-width: 46ch; margin-inline: auto; margin-bottom: var(--sp-md); font-size: var(--fs-md); }
  .error-actions { display: flex; gap: var(--sp-xs); justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <main class="error-page">
    <div>
      <p class="error-code" aria-hidden="true">404</p>
      <h1>Página não encontrada</h1>
      <p>A página que você tentou acessar não existe ou foi movida. Volte para a página inicial para conhecer os serviços de fisioterapia em São José do Rio Preto.</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/">Voltar para a página inicial</a>
        <a class="btn btn-secondary" href="/#contato">Falar com a Dra. Camila Sandoval Maioli</a>
      </div>
    </div>
  </main>
</body>
</html>
